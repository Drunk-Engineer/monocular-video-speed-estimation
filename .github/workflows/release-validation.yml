name: Release asset validation

"on":
  workflow_dispatch:
    inputs:
      version:
        description: GitHub Release tag to validate
        required: true
        default: v1.0.0
      model_asset:
        description: Model asset filename
        required: true
        default: r3d18_tcn_thesis_v1.0.0.pt
      metadata_asset:
        description: Model metadata filename
        required: true
        default: r3d18_tcn_thesis_v1.0.0.json

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          MODEL_ASSET: ${{ inputs.model_asset }}
          METADATA_ASSET: ${{ inputs.metadata_asset }}
        run: |
          mkdir -p checkpoints
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${MODEL_ASSET}" \
            --pattern "${METADATA_ASSET}" \
            --pattern "SHA256SUMS.txt" \
            --dir checkpoints

      - name: Verify checksum
        working-directory: checkpoints
        run: sha256sum --check SHA256SUMS.txt

      - name: Validate model metadata
        env:
          RELEASE_TAG: ${{ inputs.version }}
          MODEL_ASSET: ${{ inputs.model_asset }}
          METADATA_ASSET: ${{ inputs.metadata_asset }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          model = Path("checkpoints") / os.environ["MODEL_ASSET"]
          metadata_path = Path("checkpoints") / os.environ["METADATA_ASSET"]
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          checkpoint = metadata.get("checkpoint", {})
          model_sha256 = hashlib.sha256(model.read_bytes()).hexdigest()

          if metadata.get("version") != os.environ["RELEASE_TAG"].removeprefix("v"):
              raise SystemExit("model metadata version does not match the Release tag")
          if checkpoint.get("filename") != model.name:
              raise SystemExit("model metadata filename does not match the asset")
          if checkpoint.get("sha256") != model_sha256:
              raise SystemExit("model metadata SHA-256 does not match the asset")
          if metadata.get("license") != "CC-BY-4.0":
              raise SystemExit("model metadata license is not CC-BY-4.0")
          load_contract = checkpoint.get("load_contract", {})
          if load_contract.get("weights_only") is not True:
              raise SystemExit("model metadata does not require weights_only loading")
          if load_contract.get("strict") is not True:
              raise SystemExit("model metadata does not require strict loading")
          PY

      - name: Run public demo with the release model
        env:
          MODEL_ASSET: ${{ inputs.model_asset }}
        run: |
          monocular-speed infer \
            --input sample_data/anonymized_demo.mp4 \
            --checkpoint "checkpoints/${MODEL_ASSET}" \
            --output outputs/release

      - name: Validate release output exists
        run: test -s outputs/release/predictions.csv

      - name: Compare against the published demo regression
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd

          expected = pd.read_csv("sample_data/demo_results.csv")[
              "predicted_speed_kmh"
          ].to_numpy()
          actual = pd.read_csv("outputs/release/predictions.csv")[
              "predicted_speed_kmh"
          ].to_numpy()

          if len(actual) != 300 or not np.isfinite(actual).all():
              raise SystemExit("release inference output is incomplete or non-finite")
          absolute = np.abs(expected - actual)
          maximum = float(np.max(absolute))
          mean = float(np.mean(absolute))
          p95 = float(np.quantile(absolute, 0.95))
          print(
              "cross-platform demo regression",
              f"max_abs={maximum:.9f}",
              f"mean_abs={mean:.9f}",
              f"p95_abs={p95:.9f}",
          )

          # The v1.0.0 CSV was produced with the macOS OpenCV decoder. The
          # model and demo bytes are checked exactly above, while this numeric
          # envelope accounts for the measured platform-dependent YUV-to-RGB
          # conversion in OpenCV 4.12.
          if maximum > 0.75 or mean > 0.30 or p95 > 0.65:
              raise SystemExit(
                  "cross-platform demo regression exceeded the v1.0.0 envelope"
              )
          PY
